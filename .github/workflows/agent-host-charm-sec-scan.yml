name: "[agent] [scan] Agent Host Charm Security Scan"
run-name: "[agent] [scan] Agent Host Charm Security Scan (${{ github.event_name == 'push' && 'stable' || github.event_name == 'schedule' && 'stable' || github.event.inputs.channel }})"

permissions: {}

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly, Mondays at 03:00 UTC
  workflow_dispatch:
    inputs:
      channel:
        description: The charm channel to scan
        required: true
        default: beta
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan Charm with Trivy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: ubuntu@22.04
            arch: amd64
            distro: jammy
          - base: ubuntu@24.04
            arch: amd64
            distro: noble
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    env:
      CHANNEL: ${{ github.event_name == 'push' && 'stable' || github.event_name == 'schedule' && 'stable' || github.event.inputs.channel }}
      BASE: ${{ matrix.base }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Install Juju
        run: sudo snap install juju --classic
      - name: Download and Unpack Charm
        env:
          BASE: ${{ matrix.base }}
          ARCH: ${{ matrix.arch }}
        run: |
          CHARM=$(juju download testflinger-agent-host --channel="$CHANNEL" --base="$BASE" --arch="$ARCH" 2>&1 | grep ".charm$" | sed -e 's/.*\(testflinger.*.charm\)/\1/')

          # Extract the contents to a local folder
          unzip -d unpacked-charm "$CHARM"
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'unpacked-charm'
          exit-code: 1
          format: 'sarif'
          vuln-type: library
          output: 'testflinger-agent-host-trivy-results.sarif'
          # By default, SARIF format enforces output of all vulnerabilities regardless of configured severities.
          severity: 'UNKNOWN,LOW,MEDIUM,CRITICAL,HIGH'
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: 'testflinger-agent-host-trivy-results.sarif'
          category: ${{ matrix.distro }}-${{ matrix.arch }}
          wait-for-processing: "true"