name: "[integration] Run integration tests"
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/integration.yml
      - server/**
      - common/**
      - agent/**
      - cli/**
      - integration/**
  pull_request:
    paths:
      - .github/workflows/integration.yml
      - server/**
      - common/**
      - agent/**
      - cli/**
      - integration/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration_test:
    name: Run integration tests
    defaults:
      run:
        working-directory: .
    runs-on: ubuntu-latest
    permissions:
      read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: sudo snap install --classic just
      - run: sudo snap install --classic lxd
      - run: sudo snap install --classic workshop
      - run: ust workshop serve
      - run: just workshop populate
      - run: workshop exec dev -- just agent start fake_connector test_agent &
      - run: workshop exec dev -- just integration test

