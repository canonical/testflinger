name: "[agent] Release testflinger-agent-host charm"
run-name: "[agent] Release testflinger-agent-host charm (${{ github.event_name == 'push' && 'beta' || github.event.inputs.channel }})"
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - agent/charms/testflinger-agent-host-charm/**
      - .github/workflows/agent-host-charm-release.yml
  workflow_dispatch:
    inputs:
      channel:
        description: The channel to release the charm to
        required: true
        default: latest/edge
        type: choice
        options:
          - latest/beta
          - latest/edge

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-build-and-push-charm:
    name: Build and Push Charm

    runs-on: ${{ matrix.runner }}
    # The build process uses LXD to pack all bases from the same architecture using single runner.
    # Additional runners can be added to the matrix to build other architectures.
    # Do not parallelize to prevent charm release upload race conditions.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64

    permissions:
      actions: read # necessary to get the runner information
      contents: write # necessary to create tag(s)
      packages: write # necessary to upload image

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: latest/stable
      - name: Build and upload charm to charmhub
        uses: canonical/charming-actions/upload-charm@1753e0803f70445132e92acd45c905aba6473225 # 2.7.0
        with:
          charm-path: agent/charms/testflinger-agent-host-charm
          destructive-mode: false
          credentials: "${{ secrets.CHARMHUB_TOKEN }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          channel: ${{ github.event_name == 'push' && 'latest/beta' || github.event.inputs.channel }}
          tag-prefix: "agent-host-charm"
          charmcraft-channel: latest/stable

  scan:
    needs: agent-build-and-push-charm
    name: Scan Charm with Trivy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: ubuntu@22.04
            arch: amd64
            distro: jammy
          - base: ubuntu@24.04
            arch: amd64
            distro: noble
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    env:
      CHANNEL: ${{ github.event_name == 'push' && 'beta' || github.event_name == 'schedule' && 'stable' || github.event.inputs.channel }}
    steps:
      - name: Install Juju
        run: sudo snap install juju --classic
      - name: Download and Unpack Charm
        env:
          BASE: ${{ matrix.base }}
          ARCH: ${{ matrix.arch }}
        run: |
          CHANNEL=$(echo "$CHANNEL" | sed "-e s,latest/,,")
          CHARM=$(juju download testflinger-agent-host --channel="$CHANNEL" --base="$BASE" --arch="$ARCH" 2>&1 | grep ".charm$" | sed -e 's/.*\(testflinger.*.charm\)/\1/')

          # Extract the contents to a local folder
          unzip -d unpacked-charm "$CHARM"
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "unpacked-charm"
          exit-code: 1
          format: "sarif"
          vuln-type: library
          output: "testflinger-agent-host-trivy-results.sarif"
          # By default, SARIF format enforces output of all vulnerabilities regardless of configured severities.
          severity: "UNKNOWN,LOW,MEDIUM,CRITICAL,HIGH"
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: "testflinger-agent-host-trivy-results.sarif"
          category: ${{ matrix.distro }}-${{ matrix.arch }}
          wait-for-processing: "true"
