[build-system]
requires = ["uv-build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "testflinger-common"
description = "Testflinger common modules"
readme = "README.md"
version = "1.1.4"
requires-python = ">=3.10"
dependencies = ["strenum>=0.4.15"]

[dependency-groups]
dev = ["pytest>=8.3.5", "ruff>=0.11.6"]

[tool.ruff]
line-length = 79
include = [
  "src/**/*.py",
  "tests/**/*.py",
]

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # comprehension
    "D",   # docstrings
    "DTZ", # flake8-datetimez
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "G",   # flake8-logging-format
    "I",   # isort
    "LOG", # flake8-logging
    "N",   # naming
    "PLE", # pylint errors
    "PLW", # pylint warnings
    "S",   # flake8-bandit
    "W",   # pycodestyle warnings
]
ignore = [
    "D104", # docstring: Missing docstring in public package
    "D205", # docstring: missing-blank-line-after-summary
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # use of assert
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
