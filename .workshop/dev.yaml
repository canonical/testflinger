name: dev
base: ubuntu@24.04
#
# tunnel endpoints — the two sides are ASYMMETRIC. Do not "unify" them:
#
#   docker-ce SLOT endpoint  -> LXD proxy CONNECT target (dialed inside the
#                               container's netns). Must be 127.0.0.1:PORT so
#                               dockerd (userland-proxy=false) is reachable on
#                               container loopback.
#   system   PLUG endpoint   -> LXD proxy LISTEN address (on the HOST).
#                               The local plugs bind 127.0.0.1; the expose plugs
#                               bind 0.0.0.0 for trusted-network demos.
#
sdks:
  - name: just
  - name: uv
  - name: vscode-remote
  - name: opencode
  - name: docker-ce
    slots:
      testflinger-server:
        interface: tunnel
        endpoint: 127.0.0.1:5000  # connect: in the workshop (container loopback)
      testflinger-metrics:
        interface: tunnel
        endpoint: 127.0.0.1:9090  # connect: in the workshop (container loopback)
      dex-server:
        interface: tunnel
        endpoint: 127.0.0.1:5556  # connect: in the workshop (container loopback)
  - name: system
    plugs:
      localhost-tcp5000:
        interface: tunnel
        endpoint: 127.0.0.1:5000
      localhost-tcp9090:
        interface: tunnel
        endpoint: 127.0.0.1:9090
      localhost-tcp5556:
        interface: tunnel
        endpoint: 127.0.0.1:5556
      expose-tcp5000:
        interface: tunnel
        endpoint: 0.0.0.0:5000  # listen: on the host, all interfaces (external access)
      expose-tcp9090:
        interface: tunnel
        endpoint: 0.0.0.0:9090  # listen: on the host, all interfaces (external access)
      expose-tcp5556:
        interface: tunnel
        endpoint: 0.0.0.0:5556  # listen: on the host, all interfaces (external access)
