# The fake connector requires no DUT and is the default development agent.
agent_id: fake_connector
server_address: http://localhost:5000
execution_basedir: /tmp/testflinger/fake_connector/run
logging_basedir: /tmp/testflinger/fake_connector/logs
results_basedir: /tmp/testflinger/fake_connector/results
job_queues:
  - fake_connector
provision_type: fake_connector
provision_command: testflinger-device-connector fake_connector provision -c /project/agent/devel/fake_connector.yaml testflinger.json
test_command: testflinger-device-connector fake_connector runtest -c /project/agent/devel/fake_connector.yaml testflinger.json
reserve_command: testflinger-device-connector fake_connector reserve -c /project/agent/devel/fake_connector.yaml testflinger.json
cleanup_command: testflinger-device-connector fake_connector cleanup -c /project/agent/devel/fake_connector.yaml testflinger.json
