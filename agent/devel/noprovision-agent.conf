# The agent may reach a DUT but never runs the Workshop CLI or accesses LXD
# directly.
agent_id: workshop_noprovision
server_address: http://localhost:5000
execution_basedir: /tmp/testflinger/workshop_noprovision/run
logging_basedir: /tmp/testflinger/workshop_noprovision/logs
results_basedir: /tmp/testflinger/workshop_noprovision/results
job_queues:
  - workshop_noprovision
provision_type: noprovision
provision_command: testflinger-device-connector noprovision provision -c /project/agent/devel/.testflinger/noprovision/noprovision-dut.yaml testflinger.json
test_command: testflinger-device-connector noprovision runtest -c /project/agent/devel/.testflinger/noprovision/noprovision-dut.yaml testflinger.json
reserve_command: testflinger-device-connector noprovision reserve -c /project/agent/devel/.testflinger/noprovision/noprovision-dut.yaml testflinger.json
cleanup_command: testflinger-device-connector noprovision cleanup -c /project/agent/devel/.testflinger/noprovision/noprovision-dut.yaml testflinger.json
